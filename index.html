<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搜索小队 · 战前分配 Demo</title>
<style>
  :root{
    --bg:#15120f; --panel:#201b16; --panel2:#2a231c; --line:#3d332a;
    --gold:#d4a94e; --text:#e8ddc8; --dim:#9b8c74;
    --phys:#d05a4e; --magic:#5a8fd0; --tank:#7a9a5a; --ok:#6fbf73; --bad:#d05a4e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Microsoft YaHei",system-ui,sans-serif;padding:20px;max-width:1280px;margin:0 auto}
  h1{font-size:22px;color:var(--gold);letter-spacing:2px;margin-bottom:4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px}
  h2{font-size:15px;color:var(--gold);margin:18px 0 8px;border-left:3px solid var(--gold);padding-left:8px}

  .layout{display:grid;grid-template-columns:1fr 340px;gap:16px}
  @media(max-width:960px){.layout{grid-template-columns:1fr}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}

  /* 英雄池 */
  .hero-pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .hero-card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;position:relative;transition:.15s}
  .hero-card:hover{border-color:var(--gold)}
  .hero-card.picked{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
  .hero-card .avatar{font-size:34px;line-height:1}
  .hero-card .nm{font-weight:bold;margin:4px 0 2px}
  .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;margin-right:4px}
  .tag.武{background:rgba(208,90,78,.2);color:var(--phys);border:1px solid var(--phys)}
  .tag.法{background:rgba(90,143,208,.2);color:var(--magic);border:1px solid var(--magic)}
  .tag-t{background:rgba(122,154,90,.2);color:var(--tank);border:1px solid var(--tank)}
  .tag-w{background:rgba(208,90,78,.2);color:var(--phys);border:1px solid var(--phys)}
  .tag-f{background:rgba(90,143,208,.2);color:var(--magic);border:1px solid var(--magic)}
  .hero-card .stat{font-size:12px;color:var(--dim)}
  .hero-card .role-now{position:absolute;top:8px;right:8px;font-size:11px;color:var(--gold)}

  /* 阵容槽：从左到右 ③② 输出位并排，间隔加宽后是 ① 前排位，同一水平线 */
  .slots{display:grid;grid-template-columns:1fr 1fr 36px 1fr;gap:10px;align-items:start}
  .slot{background:var(--panel2);border:1px dashed var(--line);border-radius:8px;padding:10px;min-height:120px;text-align:center}
  .slot.front{border-style:solid;border-color:rgba(122,154,90,.6)}
  .slot .pos{font-size:12px;color:var(--dim)}
  .slot .pos b{color:var(--tank)}
  .slot .empty{color:#5c5245;font-size:13px;margin-top:34px}
  .slot .who{font-size:30px;text-align:center}
  .slot .who svg{max-width:52px}
  .slot .nm{font-weight:bold}
  .slot .gear{margin-top:6px;font-size:12px;text-align:left}
  .gear .g{display:flex;justify-content:space-between;padding:2px 4px;border-radius:4px;margin-top:2px;background:#1a1611}
  .gear .g button{background:none;border:none;color:var(--bad);cursor:pointer;font-size:11px}
  .gear-total{margin-top:6px;padding:7px 10px;background:#1a1611;border-radius:6px;font-size:13px;color:var(--dim)}

  /* 仓库 */
  .armory{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .item{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;font-size:12px;transition:.15s}
  .item:hover{border-color:var(--gold)}
  .item .in{font-weight:bold;margin-bottom:2px}
  .item .eff{color:var(--dim)}
  .item.equipped{opacity:.35;cursor:default}
  .tabs{display:flex;gap:6px;margin-bottom:8px}
  .tabs button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);padding:4px 12px;border-radius:6px;cursor:pointer;font-size:12px}
  .tabs button.on{color:var(--gold);border-color:var(--gold)}
  .hint{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.7}

  /* 右栏 */
  .verdict{font-size:20px;font-weight:bold;text-align:center;padding:8px;border-radius:8px;margin-bottom:10px}
  .v-武者流{background:rgba(208,90,78,.15);color:var(--phys)}
  .v-法师流{background:rgba(90,143,208,.15);color:var(--magic)}
  .v-混合流{background:rgba(212,169,78,.15);color:var(--gold)}
  .v-未成型{background:#26211a;color:var(--dim)}
  .meter{margin:8px 0}
  .meter .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
  .bar{height:10px;background:#1a1611;border-radius:5px;overflow:hidden;display:flex}
  .bar .p{background:var(--phys)} .bar .m{background:var(--magic)} .bar .t{background:var(--tank)}
  .room-pick{display:flex;gap:8px;margin:8px 0}
  .room-pick button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:6px;cursor:pointer}
  .room-pick button.on{border-color:var(--gold);color:var(--gold)}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 8px}
  .panel-head h2{margin:0}
  .flow-btn{background:linear-gradient(135deg,#8a6a2a,#c9a04a);color:#1a1408;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-weight:bold;font-size:13px}
  .flow-menu-wrap{position:relative}
  .flow-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);width:300px;background:var(--panel2);border:1px solid var(--gold);border-radius:8px;padding:6px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .flow-menu.open{display:grid;gap:6px}
  .flow-menu button{display:block;text-align:left;background:#1a1611;border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:6px;cursor:pointer}
  .flow-menu button:hover{border-color:var(--gold)}
  .flow-menu small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
  .btn-main{width:100%;padding:12px;font-size:16px;background:linear-gradient(135deg,#8a6a2a,#c9a04a);color:#1a1408;border:none;border-radius:8px;cursor:pointer;font-weight:bold;margin-top:10px}
  .btn-main:disabled{filter:grayscale(.8);cursor:not-allowed}

  /* 战斗 */
  #battle{display:none;position:fixed;inset:0;background:rgba(10,8,6,.92);z-index:50;overflow:auto;padding:24px}
  #battle .box{max-width:860px;margin:0 auto}
  #battle h2{margin-top:14px}
  .log{background:#141110;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13px;line-height:1.9;max-height:300px;overflow:auto;font-family:Consolas,monospace}
  .log .r{color:var(--phys)} .log .b{color:var(--magic)} .log .win{color:var(--ok);font-weight:bold} .log .lose{color:var(--bad);font-weight:bold}
  .hprow{display:flex;gap:8px;margin:6px 0;flex-wrap:wrap}
  .hpchip{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:12px;min-width:110px}
  .hpbar{height:6px;background:#1a1611;border-radius:3px;margin-top:3px}
  .hpbar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:.3s}
</style>
</head>
<body>
<h1>搜索小队 · 战前分配 Demo</h1>
<div class="sub">指挥官配置阶段：从英雄池选 3 名英雄（1 前排 + 2 输出），从军械库分配装备，确定流派后出发迎战。</div>

<div class="layout">
  <div>
    <div class="panel">
      <h2>① 英雄池（点击上阵 / 再点取消）</h2>
      <div class="hero-pool" id="heroPool"></div>
    </div>

    <div class="panel" style="margin-top:14px">
      <div class="panel-head">
        <h2>② 出战阵容（左侧为 ③、② 输出位，右侧靠外的是 ① 前排位）</h2>
        <div class="flow-menu-wrap">
          <button class="flow-btn" onclick="toggleFlowMenu(event)">⚡ 一键配置 ▾</button>
          <div class="flow-menu" id="flowMenu">
            <button onclick="autoConfig('武')">
              <b style="color:var(--phys)">武者流</b>
              <small>石敢当前排 + 双武者 · 纯物理路线</small>
              <small style="color:#7a8a6a">✓ 适合：物理生物房（红）| ✗ 魔法房建议绕行</small>
            </button>
            <button onclick="autoConfig('法')">
              <b style="color:var(--magic)">法师流</b>
              <small>青璃前排 + 双法师 · 纯魔法路线</small>
              <small style="color:#7a8a6a">✓ 适合：魔法生物房（蓝）| ✗ 物理房建议绕行</small>
            </button>
            <button onclick="autoConfig('混')">
              <b style="color:var(--gold)">混合流</b>
              <small>最优前排 + 武/法各一 · 全能路线</small>
              <small style="color:#7a8a6a">✓ 适合：任意房间均能应战，BOSS房表现均衡</small>
            </button>
          </div>
        </div>
      </div>
      <div class="slots" id="slots"></div>
      <div class="gear-total" id="gearTotal"></div>
      <div class="hint">前排英雄由防具提供承伤；输出英雄由物理/魔法装备提供伤害。职业与装备错配收益打折：武者穿魔法装、法师穿物理装，装备效果 <b style="color:var(--bad)">×0.4</b>。</div>
    </div>

    <div class="panel" style="margin-top:14px">
      <h2>③ 军械库（选中一名己方英雄后点击装备）</h2>
      <div class="tabs" id="armoryTabs"></div>
      <div class="armory" id="armory"></div>
      <div class="hint" id="armoryHint">先在上方点选一名英雄，再点装备为其穿上。</div>
    </div>
  </div>

  <div>
    <div class="panel">
      <h2>流派判定</h2>
      <div class="verdict v-未成型" id="verdict">未成型</div>
      <div class="meter"><div class="lbl"><span>战力构成</span><span id="powSum"></span></div>
        <div class="bar"><i class="p" id="barP" style="width:0"></i><i class="m" id="barM" style="width:0"></i><i class="t" id="barT" style="width:0"></i></div>
        <div class="lbl"><span><span style="color:var(--phys)">■</span> 物理</span><span><span style="color:var(--magic)">■</span> 魔法</span><span><span style="color:var(--tank)">■</span> 承伤</span></div>
      </div>
      <div class="hint" id="advice"></div>
    </div>

    <div class="panel" style="margin-top:14px">
      <h2>选择迎战房间</h2>
      <div class="room-pick" id="roomPick">
        <button data-room="phys" class="on">物理生物房<br><small style="color:var(--dim)">红·实体群</small></button>
        <button data-room="magic">魔法生物房<br><small style="color:var(--dim)">蓝·幽灵群</small></button>
        <button data-room="boss">将军BOSS房<br><small style="color:var(--dim)">均衡·高难</small></button>
      </div>
      <div class="hint" id="roomInfo"></div>
      <button class="btn-main" id="goBattle" disabled>阵容未成型</button>
    </div>
  </div>
</div>

<div id="battle">
  <div class="box">
    <h1>战斗模拟</h1>
    <div class="sub" id="battleSub"></div>
    <h2>我方阵容</h2><div class="hprow" id="allyHp"></div>
    <h2>敌方阵容</h2><div class="hprow" id="enemyHp"></div>
    <h2>战斗过程</h2><div class="log" id="log"></div>
    <button class="btn-main" onclick="document.getElementById('battle').style.display='none'">返回调整配置</button>
  </div>
</div>

<script>
/* ============ SVG 头像 ============ */
function face(id, skin, hair, hair2, extra){
  return `<svg viewBox="0 0 100 100" width="100%" style="max-width:64px;display:block">
    <defs><clipPath id="cf${id}"><circle cx="50" cy="50" r="46"/></clipPath></defs>
    <circle cx="50" cy="50" r="46" fill="#2a231c" stroke="#3d332a" stroke-width="2"/>
    <g clip-path="url(#cf${id})">
      <ellipse cx="50" cy="118" rx="42" ry="40" fill="${hair2}"/>
      <!-- 脖子与肩 -->
      <rect x="40" y="66" width="20" height="16" fill="${skin}"/>
      <path d="M18 100 Q50 74 82 100 Z" fill="${extra.armor}"/>
      <!-- 脸 -->
      <ellipse cx="50" cy="44" rx="22" ry="25" fill="${skin}"/>
      <!-- 发型 -->
      ${extra.hairStyle}
      <!-- 眉眼 -->
      <path d="M36 42 q5 -4 11 0" stroke="#2a1f16" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M53 42 q5 -4 11 0" stroke="#2a1f16" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <ellipse cx="41.5" cy="49" rx="3" ry="3.6" fill="#1c130c"/><ellipse cx="58.5" cy="49" rx="3" ry="3.6" fill="#1c130c"/>
      <circle cx="42.6" cy="47.9" r="1" fill="#fff"/><circle cx="59.6" cy="47.9" r="1" fill="#fff"/>
      <!-- 鼻嘴 -->
      <path d="M50 52 q-2 5 1 7" stroke="${skin}" stroke-width="2" fill="none" opacity="0.6"/>
      <path d="M45 63 q5 3 10 0" stroke="#6b3a30" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      ${extra.deco||""}
    </g>
  </svg>`;
}
const AVATARS = {
  1: face(1,"#d9a878","#4a3428","#5a4234",{armor:"#7a4a3a",hairStyle:`<path d="M28 40 q0 -22 22 -22 q22 0 22 22 l-4 -8 q-6 -8 -18 -8 q-12 0 -18 8 Z" fill="#4a3428"/>`,deco:`<path d="M30 34 q20 -8 40 0" stroke="#8a2f28" stroke-width="4" fill="none"/><circle cx="30" cy="34" r="2.4" fill="#8a2f28"/>`}),
  2: face(2,"#c98f62","#23201e","#332e2a",{armor:"#4a4a52",hairStyle:`<path d="M28 42 q2 -24 22 -24 q20 0 22 24 l-3 -6 q-8 -10 -19 -10 q-11 0 -19 10 Z" fill="#23201e"/><path d="M27 42 l-3 14 l6 2 z" fill="#23201e"/>`,deco:`<path d="M60 36 l10 6 M62 33 l10 6" stroke="#9aa0aa" stroke-width="2.2"/>`}),
  3: face(3,"#e8b98c","#5a2f28","#6e3a30",{armor:"#a0524a",hairStyle:`<path d="M27 38 q4 -20 23 -20 q19 0 23 20 l-6 -4 q-8 -6 -17 -6 q-9 0 -17 6 Z" fill="#5a2f28"/><circle cx="72" cy="46" r="7" fill="#5a2f28"/>`,deco:`<circle cx="50" cy="30" r="3" fill="#d4a94e"/>`}),
  4: face(4,"#e3c39a","#2c3448","#3a4460",{armor:"#3f5a8a",hairStyle:`<path d="M28 40 q0 -22 22 -22 q22 0 22 22 q-6 -12 -22 -12 q-16 0 -22 12 Z" fill="#2c3448"/>`,deco:`<path d="M68 40 l6 -12 l3 2 l-5 11 z" fill="#d4a94e"/>`}),
  5: face(5,"#ecd0b0","#5c4632","#6e5640",{armor:"#6a7a58",hairStyle:`<ellipse cx="50" cy="32" rx="24" ry="16" fill="#5c4632"/><path d="M26 36 q24 14 48 0 l0 8 q-24 12 -48 0 Z" fill="#5c4632"/>`,deco:`<path d="M41 57 q9 6 18 0" stroke="#8a5a3a" stroke-width="2.2" fill="none"/>`}),
  6: face(6,"#e6c8a4","#3a3040","#483c50",{armor:"#8a5a3a",hairStyle:`<path d="M27 44 q-2 -26 23 -26 q25 0 23 26 l-5 -10 q-8 -8 -18 -8 q-10 0 -18 8 Z" fill="#3a3040"/>`,deco:`<circle cx="35" cy="55" r="2.6" fill="#c33"/><circle cx="65" cy="55" r="2.6" fill="#c33"/>`}),
  7: face(7,"#c9a074","#3c342c","#4a4038",{armor:"#5a6a4a",hairStyle:`<path d="M28 40 q0 -20 22 -20 q22 0 22 20 l-4 -6 q-8 -8 -18 -8 q-10 0 -18 8 Z" fill="#3c342c"/><rect x="26" y="36" width="48" height="6" rx="3" fill="#6a7a58"/>`,deco:`<path d="M43 63 h14" stroke="#6b3a30" stroke-width="2.6" stroke-linecap="round"/>`}),
  8: face(8,"#e8cba8","#384058","#46507a",{armor:"#4a5a7a",hairStyle:`<path d="M28 40 q0 -22 22 -22 q22 0 22 22 l-4 -8 q-8 -8 -18 -8 q-10 0 -18 8 Z" fill="#384058"/><path d="M26 40 q-2 20 5 30 l6 -4 q-6 -12 -4 -26 z" fill="#384058"/><path d="M74 40 q2 20 -5 30 l-6 -4 q6 -12 4 -26 z" fill="#384058"/>`,deco:`<circle cx="50" cy="30" r="3" fill="#7ab0d0"/>`}),
};

/* ============ 数据 ============ */
/* 属性：武力（物理输出）/ 法力（魔法输出）/ 生命（生存） */
const HEROES = [
  {id:7,nm:"铁壁·石敢当", cls:"武", avatar:AVATARS[7], wu:22, fa:8, hp:170, dr:0.30, tank:true, ult:"铁壁：防御型武者，受到的伤害降低30%，天然前排"},
  {id:8,nm:"玄盾·青璃", cls:"法", avatar:AVATARS[8], wu:8, fa:22, hp:172, dr:0.28, tank:true, ult:"玄盾：防御型法师，受到的伤害降低28%，天然前排"},
  {id:1,nm:"铁掌·岳昆", cls:"武", avatar:AVATARS[1], wu:52, fa:6, hp:100, ult:"裂石掌：对物理生物造成320%武力伤害"},
  {id:2,nm:"断刀·戚风", cls:"武", avatar:AVATARS[2], wu:48, fa:5, hp:96,  ult:"旋风斩：全体输出，物理房内伤害翻倍"},
  {id:3,nm:"拳娘·红缨", cls:"武", avatar:AVATARS[3], wu:50, fa:5, hp:92,  ult:"崩拳：击晕物理生物2回合"},
  {id:4,nm:"雷法·闻潮", cls:"法", avatar:AVATARS[4], wu:6, fa:54, hp:84,  ult:"天雷引：对魔法生物造成320%法力伤害"},
  {id:5,nm:"符师·白芷", cls:"法", avatar:AVATARS[5], wu:5, fa:46, hp:88,  ult:"缚灵符：全体输出并降低魔法生物攻速"},
  {id:6,nm:"幽灯·聂晚", cls:"法", avatar:AVATARS[6], wu:5, fa:50, hp:80,  ult:"引魂灯：吸收魔法生物伤害为全队护盾"},
];
const ITEMS = [
  {id:11,nm:"玄铁重甲", type:"防具", eff:"+180 承伤生命", t:180, val:60},
  {id:12,nm:"镇魂皮铠", type:"防具", eff:"+150 承伤生命, -8% 承伤", t:150, dr:0.08, val:55},
  {id:13,nm:"金刚护腕", type:"防具", eff:"+120 承伤生命, 反伤10%", t:120, thorns:0.10, val:45},
  {id:21,nm:"百炼环首刀", type:"物理装", eff:"+26 物理攻击", p:26, val:70},
  {id:22,nm:"穿甲弩机",   type:"物理装", eff:"+18 物理攻击, +15% 攻速", p:18, as:0.15, val:65},
  {id:23,nm:"嗜血短戟",   type:"物理装", eff:"+20 物理攻击, 12% 吸血", p:20, ls:0.12, val:60},
  {id:31,nm:"引雷桃木杖", type:"魔法装", eff:"+26 魔法强度", m:26, val:70},
  {id:32,nm:"碧火琉璃珠", type:"魔法装", eff:"+18 魔法强度, +15% 回能", m:18, erg:0.15, val:65},
  {id:33,nm:"摄魂铜铃",   type:"魔法装", eff:"+20 魔法强度, 眩晕+1回合", m:20, stun:1, val:60},
];
const ROOMS = {
  phys:{nm:"物理生物房", desc:"红·实体群。我方法师的输出被削弱，武者输出吃满克制。", enemies:[{nm:"尸傀",cls:"武",hp:340,atk:34},{nm:"行尸武士",cls:"武",hp:380,atk:38},{nm:"石俑卫",cls:"武",hp:460,atk:30}]},
  magic:{nm:"魔法生物房", desc:"蓝·幽灵群。我方武者的输出被削弱，法师输出吃满克制。", enemies:[{nm:"游魂",cls:"法",hp:300,atk:36},{nm:"怨灵",cls:"法",hp:340,atk:40},{nm:"魅影",cls:"法",hp:400,atk:34}]},
  boss:{nm:"将军BOSS房", desc:"封门将军：均衡系首领，双系输出均无克制加成，但攻高血厚，考验承伤。", enemies:[{nm:"封门将军",cls:"BOSS",hp:1100,atk:52}]},
};

/* ============ 状态 ============ */
let picks=[];            // 上阵英雄 id 列表（顺序即槽位）
let roles=["tank","dps","dps"];   // 槽位定位
let equipped={};         // itemId -> heroId
let selHero=null, armoryTab="全部", roomKey="phys";

const $=id=>document.getElementById(id);

/* ============ 渲染 ============ */
function renderPool(){
  $("heroPool").innerHTML=HEROES.map(h=>{
    const on=picks.includes(h.id);
    return `<div class="hero-card ${on?'picked':''}" onclick="toggleHero(${h.id})">
      <div class="avatar">${h.avatar}</div><div class="nm">${h.nm}</div>
      <span class="tag ${h.cls}">${h.cls}</span>
      <div class="stat">武力 ${h.wu} · 法力 ${h.fa} · 生命 ${h.hp}</div>
      <div class="stat" style="color:#7a8a6a">${h.ult}</div>
      ${on?`<div class="role-now">${roles[picks.indexOf(h.id)]==='tank'?'前排':'输出'}</div>`:''}
    </div>`;}).join("");
}
function heroItems(hid){ return ITEMS.filter(it=>equipped[it.id]===hid); }
function renderSlots(){
  const mk=(hid,i)=>{
    const h=HEROES.find(x=>x.id===hid);
    const gear=heroItems(hid).map(it=>`<div class="g"><span>${it.nm}</span><button onclick="unequip(${it.id})">✕</button></div>`).join("");
    return `<div class="slot${i===0?' front':''}" onclick="selHero=${hid};renderAll()">
      <div class="pos">${i===0?'① 前排位':(i===1?'② 输出位':'③ 输出位')}</div>
      <div class="who">${h.avatar}</div><div class="nm">${h.nm}</div>
      <span class="tag ${h.cls}">${h.cls}</span>
      <div class="gear">${gear||'<div style="color:#5c5245;font-size:11px">未穿装备</div>'}</div>
    </div>`;
  };
  const empty=i=>`<div class="slot${i===0?' front':''}"><div class="pos">${i===0?'① 前排位':(i===1?'② 输出位':'③ 输出位')}</div><div class="empty">空槽位</div></div>`;
  const cell=i=>picks[i]!=null?mk(picks[i],i):empty(i);
  $("slots").innerHTML=cell(2)+cell(1)+'<div></div>'+cell(0);
  const eq=ITEMS.filter(it=>equipped[it.id]!=null);
  $("gearTotal").innerHTML=`带入军械总价值：<b style="color:var(--gold);font-size:15px">${eq.reduce((s2,it)=>s2+it.val,0)} 文</b>（已装备 ${eq.length}/${ITEMS.length} 件）· 撤离成功后军械原样保留，可带入下一局`;
}
function renderArmory(){
  const TYPE_TAG={ "防具":`<span class="tag tag-t">🛡 防</span>`, "物理装":`<span class="tag tag-w">武</span>`, "魔法装":`<span class="tag tag-f">法</span>` };
  const tabs=["全部","防具","物理装","魔法装"];
  const TAB_LBL={ "全部":"全部", "防具":"🛡 防具", "物理装":"武 · 物理装", "魔法装":"法 · 魔法装" };
  $("armoryTabs").innerHTML=tabs.map(t=>`<button class="${armoryTab===t?'on':''}" onclick="armoryTab='${t}';renderAll()">${TAB_LBL[t]}</button>`).join("");
  $("armory").innerHTML=ITEMS.filter(it=>armoryTab==="全部"||it.type===armoryTab).map(it=>{
    const used=equipped[it.id]!=null;
    const owner=used?HEROES.find(h=>h.id===equipped[it.id]).nm:null;
    return `<div class="item ${used?'equipped':''}" onclick="equip(${it.id})">
      <div class="in">${it.nm} ${TYPE_TAG[it.type]}</div>
      <div class="eff">${it.eff}</div>
      <div class="eff">价值 <span style="color:var(--gold)">${it.val} 文</span></div>
      ${used?`<div class="eff" style="color:var(--ok)">已穿：${owner}</div>`:''}
    </div>`;}).join("");
  $("armoryHint").innerHTML = selHero&&picks.includes(selHero)
    ? `当前为 <b style="color:var(--gold)">${HEROES.find(h=>h.id===selHero).nm}</b> 穿戴装备。`
    : `先在上方点选一名英雄，再点装备为其穿上。`;
}

/* ============ 一键配置 ============ */
function toggleFlowMenu(e){
  e.stopPropagation();
  document.getElementById('flowMenu').classList.toggle('open');
}
document.addEventListener('click',e=>{
  const menu=document.getElementById('flowMenu');
  if(menu&&menu.classList.contains('open')&&!e.target.closest('.flow-menu-wrap'))menu.classList.remove('open');
});
function autoConfig(flow){
  // 前排按流派匹配：武者流用武坦、法师流用法坦、混合流选防御评分更高者
  const tanks=HEROES.filter(h=>h.tank);
  const defScore=h=>h.hp*0.9+h.dr*100;
  let tank;
  if(flow==="武")      tank=tanks.find(h=>h.cls==="武");
  else if(flow==="法") tank=tanks.find(h=>h.cls==="法");
  else                 tank=tanks.slice().sort((a,b)=>defScore(b)-defScore(a))[0];
  const wus=HEROES.filter(h=>h.cls==="武"&&!h.tank).sort((a,b)=>b.wu-a.wu);
  const fas=HEROES.filter(h=>h.cls==="法"&&!h.tank).sort((a,b)=>b.fa-a.fa);
  let team;
  if(flow==="武")      team=[tank, wus[0], wus[1]];
  else if(flow==="法") team=[tank, fas[0], fas[1]];
  else                 team=[tank, wus[0], fas[0]];
  picks=team.map(h=>h.id);
  roles=["tank","dps","dps"];
  selHero=null;
  equipped={};
  // 防具全给前排；输出装按加成数值降序、强者优先拿好装
  ITEMS.filter(it=>it.type==="防具").forEach(it=>equipped[it.id]=team[0].id);
  const score=it=>((it.p||it.m||0)+(it.as||it.erg||0)*20);
  const dpsWu=team.slice(1).filter(h=>h.cls==="武");
  const dpsFa=team.slice(1).filter(h=>h.cls==="法");
  if(dpsWu.length)ITEMS.filter(it=>it.type==="物理装").sort((a,b)=>score(b)-score(a)).forEach((it,i)=>equipped[it.id]=dpsWu[i%dpsWu.length].id);
  if(dpsFa.length)ITEMS.filter(it=>it.type==="魔法装").sort((a,b)=>score(b)-score(a)).forEach((it,i)=>equipped[it.id]=dpsFa[i%dpsFa.length].id);
  document.getElementById('flowMenu').classList.remove('open');
  renderAll();
}

/* ============ 交互 ============ */
function toggleHero(id){
  const i=picks.indexOf(id);
  if(i>=0){ heroItems(id).forEach(it=>delete equipped[it.id]); if(selHero===id)selHero=null; picks.splice(i,1); }
  else if(picks.length<3) { picks.push(id); selHero=id; }
  renderAll();
}
function equip(itemId){
  if(selHero==null||!picks.includes(selHero))return alert("请先点选一名己方英雄");
  const it=ITEMS.find(x=>x.id===itemId); if(equipped[itemId]!=null)return;
  const hero=HEROES.find(h=>h.id===selHero);
  const role=roles[picks.indexOf(selHero)];
  const mismatch=(it.type==="物理装"&&hero.cls==="法")||(it.type==="魔法装"&&hero.cls==="武");
  if(role==='tank'&&it.type!=='防具') if(!confirm("该英雄当前是前排定位，穿输出装收益较低，确定？"))return;
  equipped[itemId]=selHero;
  renderAll();
}
function unequip(itemId){ delete equipped[itemId]; renderAll(); }

/* ============ 数值 ============ */
function heroPower(hid){
  const h=HEROES.find(x=>x.id===hid), role=roles[picks.indexOf(hid)];
  let p=0,m=0,t=0;
  heroItems(hid).forEach(it=>{
    let factor=1;
    if((it.type==="物理装"&&h.cls==="法")||(it.type==="魔法装"&&h.cls==="武"))factor=0.4; // 错配惩罚
    if(it.type==="防具"){ t+=it.t*(role==='tank'?1:0.5); if(it.dr&&role==='tank')t+=40*it.dr; }
    if(it.p!=null) p+=it.p*factor*(role==='dps'?1:0.5);
    if(it.m!=null) m+=it.m*factor*(role==='dps'?1:0.5);
  });
  p+=h.wu*(role==='tank'?0.3:1);
  m+=h.fa*(role==='tank'?0.3:1);
  if(role==='tank') t+=h.hp*0.9; else t+=h.hp*0.2;
  return {p,m,t,hp:h.hp,cls:h.cls,nm:h.nm,role,dr:h.dr||0};
}
function teamPower(){ return picks.map(heroPower); }
function verdict(){
  if(picks.length<3)return {txt:"未成型",cls:"v-未成型"};
  const ps=teamPower();
  const wu=picks.filter(id=>HEROES.find(h=>h.id===id).cls==="武").length;
  const physOut=ps.filter(x=>x.role==='dps'&&x.cls==="武").length;
  const magOut =ps.filter(x=>x.role==='dps'&&x.cls==="法").length;
  if(physOut===2)return {txt:"武者流 · 纯物理路线",cls:"v-武者流",adv:"对物理生物房全面优势，魔法房建议绕行。"};
  if(magOut===2) return {txt:"法师流 · 纯魔法路线",cls:"v-法师流",adv:"对魔法生物房全面优势，物理房建议绕行。"};
  return {txt:"混合流 · 全能路线",cls:"v-混合流",adv:"双系均可应战但都不极致，靠英雄练度与装备质量抬上限。"};
}
function renderVerdict(){
  const v=verdict(); $("verdict").textContent=v.txt; $("verdict").className="verdict "+v.cls;
  const ps=teamPower();
  const P=ps.reduce((s,x)=>s+x.p,0), M=ps.reduce((s,x)=>s+x.m,0), T=ps.reduce((s,x)=>s+x.t,0), S=P+M+T;
  $("powSum").textContent=`总战力 ${Math.round(S)}`;
  $("barP").style.width=(P/S*100)+"%"; $("barM").style.width=(M/S*100)+"%"; $("barT").style.width=(T/S*100)+"%";
  $("advice").innerHTML=(v.adv||"需要 3 名英雄才可出发。")+"<br>提示：右侧靠前的是 1 号前排位，第一个上阵的英雄自动站前排，想让谁扛线就先选谁。";
  const btn=$("goBattle");
  if(picks.length<3){btn.disabled=true;btn.textContent="阵容未成型";}
  else{btn.disabled=false;btn.textContent="出发迎战";}
}
function renderAll(){renderPool();renderSlots();renderArmory();renderVerdict();renderRoom();}
function renderRoom(){
  document.querySelectorAll("#roomPick button").forEach(b=>b.classList.toggle("on",b.dataset.room===roomKey));
  $("roomInfo").textContent=ROOMS[roomKey].desc;
}

/* ============ 战斗模拟 ============ */
function calcCombat(){
  const room=ROOMS[roomKey];
  const allies=teamPower().map((x,i)=>{
    const h=HEROES.find(h=>h.id===picks[i]);
    const synergy=(roomKey==="phys"&&x.cls==="武")||(roomKey==="magic"&&x.cls==="法");
    const anti=(roomKey==="phys"&&x.cls==="法")||(roomKey==="magic"&&x.cls==="武");
    const mult=synergy?1.35:anti?0.65:1;
    let dr=x.dr; heroItems(picks[i]).forEach(it=>{if(it.dr&&x.role==='tank')dr+=it.dr;});
    return {nm:h.nm,cls:x.cls,role:x.role,maxhp:x.hp+(x.role==='tank'?x.t:0)*1.2, hp:0, dps:(x.p+x.m)*0.22*mult, dr, alive:true};
  });
  const enemies=room.enemies.map(e=>({...e,maxhp:e.hp,hp:0,alive:true}));
  allies.forEach(a=>a.hp=a.maxhp); enemies.forEach(e=>e.hp=e.maxhp);
  let t=0,log=[];
  while(t<60&&allies.some(a=>a.alive)&&enemies.some(e=>e.alive)){
    t++;
    // 我方攻击：前排嘲讽下敌人优先集火，简化为总DPS分摊到存活敌人
    const totalDps=allies.filter(a=>a.alive).reduce((s,a)=>s+a.dps,0);
    enemies.filter(e=>e.alive).forEach(e=>{ e.hp-=totalDps/enemies.filter(x=>x.alive).length; if(e.hp<=0){e.hp=0;e.alive=false;log.push(`<span class="win">【第${t}回合】${e.nm} 被击倒！</span>`);} });
    // 敌方攻击：优先前排
    const totalEdps=enemies.filter(e=>e.alive).reduce((s,e)=>s+e.atk*0.22,0);
    const front=allies.find(a=>a.role==='tank'&&a.alive)||allies.find(a=>a.alive);
    if(front){ const dmg=totalEdps*(1-front.dr); front.hp-=dmg;
      if(front.hp<=0){front.hp=0;front.alive=false;log.push(`<span class="lose">【第${t}回合】${front.nm} 倒地！承伤装备不足或敌军过强。</span>`);} }
  }
  const win=enemies.some(e=>e.alive)===false&&allies.some(a=>a.alive);
  log.unshift(win?`<span class="win">★ 战斗胜利（${t}回合）— 搜刮开始，战利品已入背包。</span>`
                 :`<span class="lose">✖ 全队倒下 — 物资遗失，本次探索失败。</span>`);
  $("log").innerHTML=log.join("<br>");
  $("allyHp").innerHTML=allies.map(a=>`<div class="hpchip">${a.nm} <span style="color:var(--dim)">${a.role==='tank'?'前排':'输出'}·${a.cls}</span><div class="hpbar"><i style="width:${a.hp/a.maxhp*100}%"></i></div></div>`).join("");
  $("enemyHp").innerHTML=enemies.map(e=>`<div class="hpchip">${e.nm}<div class="hpbar"><i style="width:${e.hp/e.maxhp*100}%;background:var(--bad)"></i></div></div>`).join("");
  $("battleSub").textContent=`对阵：${room.nm} · 阵容：${verdict().txt}`;
  $("battle").style.display="block";
}
document.querySelectorAll("#roomPick button").forEach(b=>b.onclick=()=>{roomKey=b.dataset.room;renderRoom();});
$("goBattle").onclick=calcCombat;

renderAll();
</script>
</body>
